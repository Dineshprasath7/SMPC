[package]
name = "smpc"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.2"
aes-gcm = "0.10"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.3"
rand_core = "0.10"

serde = { version = "1", features = ["derive"] }
hex = "0.4"
serde_json = "1"
serde-saphyr = "1" # use your chosen/current version

clap = { version = "4.5", features = ["derive"] }
sha2 = "0.11.0"
dirs = "7.0.0"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "secret_sharing"
harness = false
